name: Release

# Release retry marker: signing secrets configured

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes of the same tag must not race to publish the same release.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated by diffing against the previous tag, which
          # needs the full history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # packages: '' stops the action from installing the obsolete "tools" package,
      # which no longer exists in the SDK repository and makes sdkmanager exit 1.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the SDK components this project builds against
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # A tag that disagrees with the version in the build file produces a release
      # whose name does not match the APK inside it. Better to stop here than to
      # publish something mislabelled.
      - name: Check the tag matches the app version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "App declares versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "Not a tag build; release tag will be v$VERSION_NAME."
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION_NAME." \
              "Bump versionName in app/build.gradle.kts, or retag as v$VERSION_NAME."
            exit 1
          fi
          echo "Tag $TAG matches the declared version."

      # Signing material comes from repository secrets. The `secrets` context is not
      # available in a step-level `if`, so the check happens inside the script and the
      # result is published as a step output.
      - name: Write signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret is configured." \
              "The release APK will be signed with the debug key and will NOT be attached."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for required in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "::error::KEYSTORE_BASE64 is set but $required is missing."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # Assets are named after the version so a downloaded file is identifiable, and a
      # checksum is published so it can be verified.
      - name: Collect release assets
        id: assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/netscope-v$VERSION.apk"
          ( cd dist && sha256sum "netscope-v$VERSION.apk" > "netscope-v$VERSION.apk.sha256" )

          # The R8 mapping is what makes a stack trace from a minified build readable.
          # It is large, so it ships compressed.
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            gzip -c app/build/outputs/mapping/release/mapping.txt > "dist/mapping-v$VERSION.txt.gz"
          fi
          ls -la dist

      - name: Verify the APK signature and declared permissions
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs "dist/netscope-v$VERSION.apk"
          echo "--- declared permissions ---"
          "$BUILD_TOOLS/aapt2" dump badging "dist/netscope-v$VERSION.apk" | grep '^uses-permission' || true
          echo "--- package ---"
          "$BUILD_TOOLS/aapt2" dump badging "dist/netscope-v$VERSION.apk" | grep '^package'

      # Always kept, so an unsigned build is still downloadable for testing even though
      # it is deliberately not attached to the release.
      - name: Upload build output as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: netscope-v${{ steps.version.outputs.version }}${{ steps.signing.outputs.signed == 'true' && '' || '-debug-signed' }}
          path: dist/
          retention-days: 30

      - name: Publish the release with the signed APK
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NetScope ${{ steps.version.outputs.tag }}
          files: |
            dist/*.apk
            dist/*.sha256
            dist/*.txt.gz
          generate_release_notes: true
          body: |
            **NetScope ${{ steps.version.outputs.tag }}** — versionCode ${{ steps.version.outputs.versionCode }}

            Verify the download against `netscope-v${{ steps.version.outputs.version }}.apk.sha256`:

            ```
            sha256sum -c netscope-v${{ steps.version.outputs.version }}.apk.sha256
            ```

            `mapping-v${{ steps.version.outputs.version }}.txt.gz` deobfuscates stack traces
            from this build. Keep it — a crash report from a minified APK is unreadable
            without the mapping that produced it.

      # An APK built without the release key is signed with the debug key. It is fine
      # for testing but must never be attached to a release as though it were official,
      # so the release is still published and the APK is left as a workflow artifact.
      - name: Publish the release without an APK
        if: steps.signing.outputs.signed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NetScope ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            **NetScope ${{ steps.version.outputs.tag }}** — versionCode ${{ steps.version.outputs.versionCode }}

            > **No APK is attached to this release.**
            >
            > No release signing key is configured for this repository, so the build was
            > signed with the debug key. A debug-signed APK must not be published as an
            > official release: it cannot be verified, and installs of it cannot be
            > upgraded by a properly signed build.
            >
            > The APK is available as a workflow artifact on
            > [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            > for testing.
            >
            > To publish signed releases, add the `KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`,
            > `KEY_ALIAS` and `KEY_PASSWORD` repository secrets, then re-run this workflow.
            > See `RELEASING.md`.
